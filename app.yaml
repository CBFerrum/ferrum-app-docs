id: docs
name: Docs
version: 0.7.13
publisher: cbferrum
summary: "Documents people write together: a home for them, templates, search by what they say, and AI agents that draft and add to them"
description: README.md
categories: [productivity]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-docs
support: https://github.com/CBFerrum/ferrum-app-docs/issues
runtime: native
requires:
  drive: ">=0.7"
# In Drive's family, Workspace (Ferrum docs/plan/apps-ui.md §11.5): Docs has an interface of its
# own and draws Drive's navigation; it installs with Drive and goes before it.
parent: drive
platform: ">=0.3.2, <0.4"
packages: [docs]
uninstall: ask
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: docs
      route: docs
      title: Docs
      description: Documents people write together
      icon: file-text
      color: "#2f5bea"
      roles: [Docs User, Docs Manager]
  shell.create:
    - {id: document, label: Document, path: docs/new}
  # What the assistant should know in Docs's pages, and what it suggests asking there.
  shell.assistant:
    - id: docs
      title: "Docs"
      instructions: >-
        A document in Docs is a file in Drive that people edit together live; a DocsTemplate is one to start from.
        Search finds documents by what they say. Quote only what the tools return of a document.
      suggestions:
        - "Find the documents about our onboarding"
        - "Summarize this document"
        - "Which templates do we have?"
